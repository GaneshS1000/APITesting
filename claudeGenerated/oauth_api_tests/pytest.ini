[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: quick sanity tests
    positive: happy-path tests
    negative: error-path tests
    e2e: end-to-end flow tests
